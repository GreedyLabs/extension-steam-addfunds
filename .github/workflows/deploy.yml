name: Deploy Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: Store to process
        type: choice
        options: [both, chrome, edge]
        default: both
      operation:
        description: Operation (status does not modify the stores)
        type: choice
        options: [status, upload, publish, deploy]
        default: status
      source-run-id:
        description: Original upload run (optional; matching upload is selected automatically)
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Lint, format & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Validate extension (web-ext)
        run: pnpm run ext:lint

  deploy:
    name: Deploy extension
    needs: check
    # PRs run checks only; the shared workflow owns packaging and independent store jobs.
    if: github.event_name != 'pull_request'
    uses: GreedyLabs/action-deploy-browser-extension/.github/workflows/deploy.yml@v2
    with:
      operation: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') && 'publish' || 'upload') || inputs.operation }}
      targets: ${{ inputs.targets != '' && inputs.targets != 'both' && inputs.targets || 'chrome, edge' }}
      source-run-id: ${{ inputs.source-run-id }}
      build-command: pnpm install --frozen-lockfile && pnpm run build:zip
      chrome-publisher-id: ${{ vars.CHROME_PUBLISHER_ID }}
      chrome-extension-id: ${{ vars.CHROME_EXTENSION_ID }}
      edge-product-id: ${{ vars.EDGE_PRODUCT_ID }}
    secrets:
      CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
